services:
  # ----------------------------------------------------
  # SERVICIO 0: POSTGRESQL (Base de Datos Relacional)
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: cdc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-intexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-intexus01}
      POSTGRES_DB: ${DB_NAME:-cdc_database}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-intexus} -d ${DB_NAME:-cdc_database}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumen_compartido/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ----------------------------------------------------
  # SERVICIO 1: FRONTEND Y BACKEND (El Auditor Web 24/7)
  # ----------------------------------------------------
  web_auditor:
    build:
      context: ./web_app
    container_name: cdc_web
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-intexus_key}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-LOCAL}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-intexus}
      - DB_PASSWORD=${DB_PASSWORD:-intexus01}
      - DB_NAME=${DB_NAME:-cdc_database}
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 15s
      timeout: 10s
      retries: 3
    volumes:
      - ./web_app:/app
      - ./volumen_compartido:/volumen_compartido
      - ./volumen_compartido/paddle_modelos:/home/appuser/.paddleocr
    # El script entrypoint.sh decide Flask (LOCAL) o Gunicorn (QA/PROD) según ENVIRONMENT
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPUS:-1.0}'      # Máximo 1 hilo del Ryzen para la web
          memory: '${WEB_MEM:-1G}'       # Máximo 1 GB de RAM

  # ----------------------------------------------------
  # SERVICIO 2: EL ENTRENADOR DE IA (Bajo Demanda)
  # ----------------------------------------------------
  ia_trainer:
    build:
      context: ./trainer_app
    container_name: cdc_trainer
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-intexus_key}
      - ENVIRONMENT=${ENVIRONMENT:-LOCAL}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-intexus}
      - DB_PASSWORD=${DB_PASSWORD:-intexus01}
      - DB_NAME=${DB_NAME:-cdc_database}
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./trainer_app:/app
      - ./volumen_compartido:/volumen_compartido
      - ./volumen_compartido/paddle_modelos:/home/appuser/.paddleocr
    # 🔄 Le agregamos restart para que el vigilante (daemon) reviva si el PC se apaga
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${TRAINER_CPUS:-2.5}'      # BOZAL: Máximo 2.5 hilos (de los 4 que tiene tu Ryzen)
          memory: '${TRAINER_MEM:-4.5G}'     # BOZAL: Máximo 4.5 GB de RAM (Tienes 6.7 libres)

  # ----------------------------------------------------
  # SERVICIO 3: REDIS (Intermediario de Tareas)
  # ----------------------------------------------------
  redis:
    image: redis:alpine
    container_name: cdc_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # ----------------------------------------------------
  # SERVICIO 4: CELERY WORKER (Procesamiento de IA en 2do Plano)
  # ----------------------------------------------------
  celery_worker:
    build:
      context: ./web_app
    container_name: cdc_celery
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-LOCAL}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-intexus}
      - DB_PASSWORD=${DB_PASSWORD:-intexus01}
      - DB_NAME=${DB_NAME:-cdc_database}
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - ./web_app:/app
      - ./volumen_compartido:/volumen_compartido
      - ./volumen_compartido/paddle_modelos:/home/appuser/.paddleocr
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1} --max-tasks-per-child=50
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CELERY_CPUS:-2.0}'      # Máximo 2 hilos para el procesamiento masivo
          memory: '${CELERY_MEM:-4.0G}'    # Máximo 4 GB de RAM